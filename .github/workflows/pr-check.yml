name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-and-test:
    name: Check, Test & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks and tests
        run: make check

      - name: Verify extension package
        run: make publish
